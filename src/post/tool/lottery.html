---
title: 抽選
description: 任意の数から被りなく抽選
---

<div>
  <label for="numN" class="field-label">母数 (1-100)</label>
  <input
    type="number"
    id="numN"
    name="numN"
    min="1"
    max="100"
    value="10"
    class="input"
  />

  <label for="numX" class="field-label">選択数 (1-100)</label>
  <input
    type="number"
    id="numX"
    name="numX"
    min="1"
    max="100"
    value="3"
    class="input"
  />

  <label class="check">
    <input type="checkbox" id="allowDup" />
    重複あり
  </label>

  <button
    id="drawButton"
    class="btn-center"
  >
    抽選する
  </button>
  <div id="result" class="result result-center"></div>
</div>

<script>{% js "lottery" %}</script>
